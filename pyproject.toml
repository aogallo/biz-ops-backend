# ==============================================================================
# PROJECT METADATA
# ==============================================================================
# Basic project information and Python version requirements
[project]
name = "biz-ops-backend"
version = "1.0.0"
description = "Business Operations Backend API"
requires-python = ">=3.12"

# ==============================================================================
# BLACK - CODE FORMATTER
# ==============================================================================
# Black is an opinionated code formatter that enforces consistent style
# Configuration: line length, Python version, and exclusion patterns
[tool.black]
line-length = 79
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# ==============================================================================
# RUFF - FAST PYTHON LINTER
# ==============================================================================
# Ruff is a fast Python linter written in Rust, combining multiple tools
# Base configuration
[tool.ruff]
line-length = 79
target-version = "py312"

# Linting rules configuration
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (import sorting)
    "C",  # flake8-comprehensions
    "B",  # flake8-bugbear (common bugs and design problems)
    "UP", # pyupgrade (upgrade syntax for newer Python versions)
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex (function complexity)
    "W191",  # indentation contains tabs
]

# Per-file ignore patterns
[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py files

# Import sorting configuration (isort replacement)
[tool.ruff.lint.isort]
known-third-party = ["fastapi", "pydantic", "sqlmodel", "sqlalchemy"]

# ==============================================================================
# PYTEST - TESTING FRAMEWORK
# ==============================================================================
# Pytest configuration for running tests and generating coverage reports
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing --cov-report=html"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

# ==============================================================================
# COVERAGE - CODE COVERAGE REPORTING
# ==============================================================================
# Configuration for measuring test coverage
[tool.coverage.run]
source = ["app"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if TYPE_CHECKING:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

# ==============================================================================
# PYLINT - STATIC CODE ANALYZER
# ==============================================================================
# Pylint configuration for static code analysis
[tool.pylint.'MESSAGES CONTROL']
disable = [
    "not-callable",
    "no-member",
]

[tool.pylint.'TYPECHECK']
generated-members = [
    "sqlalchemy.*",
    "sqlmodel.*",
]

# ==============================================================================
# MYPY - STATIC TYPE CHECKER
# ==============================================================================
# Mypy configuration for type checking Python code
# Note: SQLModel's table=True syntax is not fully supported by mypy plugins,
# so we use overrides to disable specific errors in entity files
[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
# Only use pydantic plugin - sqlalchemy plugin doesn't fully support SQLModel
plugins = ["pydantic.mypy"]

# Module-specific overrides
# Ignore missing imports for external libraries
[[tool.mypy.overrides]]
module = [
    "jwt.*",
    "bcrypt.*",
    "sqlalchemy.*",
    "sqlmodel.*",
    "pylint.*",
]
ignore_missing_imports = true

# Ignore issues in infrastructure repositories
[[tool.mypy.overrides]]
module = [
    "app.infrastructure.repositories.*",
]
ignore_missing_imports = true

# SQLModel entity files: disable call-arg error for table=True syntax
# This is needed because mypy doesn't recognize SQLModel's table keyword argument
[[tool.mypy.overrides]]
module = [
    "app.domain.entities.*",
]
disable_error_code = ["call-arg"]

# ==============================================================================
# PYDANTIC-MYPY - PYDANTIC PLUGIN FOR MYPY
# ==============================================================================
# Pydantic-specific mypy plugin configuration
[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
