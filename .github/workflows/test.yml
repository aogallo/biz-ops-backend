name: Tests

on:
  push:
    branches: [ main, develop  ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: "latest"
        enable-cache: true

    - name: Set environment variables for testing
      run: |
        echo "DATABASE_URI=sqlite:///:memory:" >> $GITHUB_ENV
        echo "AUTH0_DOMAIN=test.auth0.com" >> $GITHUB_ENV
        echo "AUTH0_AUDIENCE=https://test-api" >> $GITHUB_ENV
        echo "AUTH0_ISSUER=https://test.auth0.com/" >> $GITHUB_ENV

    - name: Install dependencies
      run: |
        uv sync --all-extras
        uv pip install -r requirements.txt -r requirements-dev.txt

    - name: Run unit tests
      run: |
        uv run pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=term-missing

    - name: Run integration tests
      run: |
        uv run pytest tests/integration/ -v --cov=app --cov-append --cov-report=xml --cov-report=term-missing

    - name: Run all tests with coverage
      run: |
        uv run pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-report=html

    - name: Upload coverage reports to Codecov
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false  # Don't fail if codecov upload fails

    - name: Archive code coverage results
      uses: actions/upload-artifact@v4
      with:
        name: code-coverage-report
        path: htmlcov/
        retention-days: 30

    - name: Test Summary
      if: always()
      run: |
        echo "## Test Results" >> $GITHUB_STEP_SUMMARY
        echo "✅ Tests completed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Check the coverage report in the artifacts." >> $GITHUB_STEP_SUMMARY
