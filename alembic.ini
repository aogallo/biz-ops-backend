# Alembic migration configuration
# This file controls database migrations for the business operations backend

[alembic]
# Path to migration scripts
script_location = alembic

# Template used to generate migration files
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone for migration timestamps
# timezone = UTC

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file
# sourceless = false

# Version location specification
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator (default is os.pathsep)
# version_path_separator = :

# Version path separator (default is os.pathsep for operating system default)
# version_path_separator = ;

# The output encoding used when revision files are written from env.py
# output_encoding = utf-8

# Database connection string (loaded from environment variables)
# sqlalchemy.url = postgresql://user:pass@localhost/dbname
# NOTE: This is overridden in env.py to use the DATABASE_URI environment variable

[post_write_hooks]
# Post-write hooks
# format using "black" - use with "revision_environment = true"
hooks = black ruff
black.type = console_scripts
black.entrypoint = black
black.options = --config pyproject.toml REVISION_SCRIPT_FILENAME
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
