version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bizops-db
    environment:
      POSTGRES_USER: bizops
      POSTGRES_PASSWORD: bizops_dev_password
      POSTGRES_DB: bizops_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizops"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bizops-app
    environment:
      - DATABASE_URI=postgresql+psycopg2://bizops:bizops_dev_password@db:5432/bizops_dev
      - DEBUG=true
      - LOG_LEVEL=DEBUG
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:
